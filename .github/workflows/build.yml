name: Build LineageOS 15.1 for SM-T285

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v8
        with:
          root-reserve-mb: 2048
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Check Disk Space
        run: df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32z1-dev libelf-dev libgl1-mesa-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Install Repo Tool
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Initialize LineageOS
        run: |
          mkdir -p ~/android/lineage
          cd ~/android/lineage
          git config --global user.name "BuildBot"
          git config --global user.email "build@local.host"
          repo init -u https://github.com/LineageOS/android.git -b lineage-15.1 --git-lfs --depth=1

      - name: Add Local Manifests (Device Trees)
        run: |
          cd ~/android/lineage
          mkdir -p .repo/local_manifests
          # Создаем манифест для SM-T285 (gtexslte)
          cat <<EOF > .repo/local_manifests/gtexslte.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <!-- Укажи здесь правильные репозитории дерева устройств, ядра и вендора под SM-T285 -->
            <!-- Пример: -->
            <!-- <project path="device/samsung/gtexslte" name="пользователь/android_device_samsung_gtexslte" remote="github" revision="lineage-15.1" /> -->
          </manifest>
          EOF

      - name: Sync Sources
        run: |
          cd ~/android/lineage
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Build Firmware
        run: |
          cd ~/android/lineage
          source build/envsetup.sh
          lunch lineage_gtexslte-userdebug
          mka bacon -j$(nproc --all)

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: LineageOS_gtexslte_Build
          path: ~/android/lineage/out/target/product/gtexslte/*.zip

